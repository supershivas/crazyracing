<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1c2c">
<title>Crazy Racing</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="js/lib/game.css?v=0.1.0">
<link rel="stylesheet" href="css/style.css?v=0.1.0">
</head>
<body>
<div class="jeu-ecran" id="ecran">
  <canvas class="jeu-canvas" id="canvas" aria-label="Crazy Racing"></canvas>

  <!-- HUD : en DOM par-dessus le canvas, mêmes couleurs que lui -->
  <div class="hud" id="hud" hidden>
    <div class="hud-haut safe-top">
      <div class="hud-bloc hud-course">
        <span class="hud-pos" id="hud-pos">1<small>/8</small></span>
        <span class="hud-tour" id="hud-tour">Tour 1/3</span>
      </div>
      <div class="hud-bloc hud-chrono">
        <span id="hud-temps">0:00.0</span>
        <small id="hud-tours">&nbsp;</small>
      </div>
      <canvas class="hud-carte" id="hud-carte" aria-label="Carte du circuit"></canvas>
      <button class="icone" id="pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
      </button>
    </div>
    <div class="hud-messages" id="hud-messages" aria-live="polite"></div>
    <div class="feux" id="feux" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="hud-bas safe-bottom">
      <div class="hud-bloc hud-pneus">
        <div class="pneu-nom"><b id="pneu-nom">Slick</b><span id="pneu-etat"></span></div>
        <div class="jauge" title="Usure"><i id="pneu-usure"></i></div>
        <div class="jauge chaleur" title="Température"><i id="pneu-chaleur"></i></div>
        <div class="pneu-choix" id="pneu-choix" role="group" aria-label="Pneus au prochain arrêt"></div>
      </div>
      <div class="hud-bloc hud-etat">
        <span id="hud-meteo">Sec</span>
        <span id="hud-limites"></span>
        <span id="hud-penalite"></span>
      </div>
      <button class="bonus-case" id="bonus-case" aria-label="Utiliser le bonus"><span id="bonus-nom">—</span></button>
      <div class="hud-bloc hud-vitesse"><b id="hud-vitesse">0</b><small>km/h</small></div>
    </div>
    <div class="tactile" id="tactile" hidden>
      <div class="tactile-g"><button data-k="gauche" aria-label="Gauche">◀</button><button data-k="droite" aria-label="Droite">▶</button></div>
      <div class="tactile-d"><button data-k="frein" aria-label="Frein">▼</button><button data-k="gaz" aria-label="Accélérer">▲</button></div>
    </div>
  </div>

  <!-- Écran titre : pas de sous-titre (section 3) -->
  <section class="titre" id="titre">
    <h1>Crazy Racing</h1>
    <nav class="titre-menu">
      <button class="bouton" id="m-course">Course</button>
      <button class="bouton" id="m-chrono">Contre la montre</button>
      <button class="bouton" id="m-ligne" hidden>En ligne</button>
      <button class="bouton" id="m-editeur" hidden>Éditeur de circuits</button>
    </nav>
    <button class="icone titre-reglages" id="ouvrir-reglages" aria-label="Réglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3c.4-1.8 2.9-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.5 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.5 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.5-1c-1.6.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1.1-2.6c-1.8-.4-1.8-2.9 0-3.4a1.7 1.7 0 0 0 1.1-2.5c-.9-1.6.8-3.3 2.4-2.4 1 .6 2.3.1 2.5-1.1z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </section>
</div>

<!-- Les boîtes de dialogue sont rattachées au body (section 17) -->
<dialog id="dialogue-course" aria-label="Préparer la course">
  <form method="dialog" id="form-course">
    <h2 id="course-titre">Course</h2>
    <fieldset class="champ"><legend>Circuit</legend><div class="circuits" id="c-circuits"></div></fieldset>
    <div class="champs" id="c-champs"></div>
    <div class="menu menu-ligne">
      <button class="bouton" value="partir" id="c-partir">Partir</button>
      <button class="bouton secondaire" value="annuler">Annuler</button>
    </div>
  </form>
</dialog>

<dialog id="dialogue-resultats" aria-label="Résultats">
  <h2 id="res-titre">Arrivée</h2>
  <p id="res-note" class="res-note"></p>
  <table class="classement" id="res-table"></table>
  <div class="menu menu-ligne">
    <button class="bouton" id="res-rejouer">Rejouer</button>
    <button class="bouton secondaire" id="res-menu">Menu</button>
  </div>
</dialog>

<dialog id="dialogue-pause" aria-label="Pause">
  <h2>Pause</h2>
  <div class="menu">
    <button class="bouton" id="reprendre">Reprendre</button>
    <button class="bouton secondaire" id="recommencer">Recommencer</button>
    <button class="bouton secondaire" id="pause-reglages">Réglages</button>
    <button class="bouton secondaire" id="quitter">Écran titre</button>
  </div>
  <p class="aide">↑ ↓ ← → ou ZQSD : conduire · Espace : bonus · 1 2 3 : pneus au prochain arrêt · Échap : pause</p>
</dialog>

<dialog id="dialogue-reglages" aria-label="Réglages">
  <h2>Réglages</h2>
  <label class="curseur">Musique <input type="range" id="vol-musique" min="0" max="100" step="10"></label>
  <label class="curseur">Effets <input type="range" id="vol-effets" min="0" max="100" step="10"></label>
  <label class="curseur">Pseudo <input type="text" id="pseudo" maxlength="12" autocomplete="off"></label>
  <hr>
  <p class="version" id="version">v…</p>
  <details>
    <summary>Dernières versions</summary>
    <div id="changelog"></div>
  </details>
  <div class="menu">
    <button class="bouton secondaire" id="exporter">Exporter la sauvegarde</button>
    <button class="bouton secondaire" id="importer">Importer une sauvegarde</button>
  </div>
  <p class="liens"><a href="labo.html">Labo</a> · <a href="atelier.html">Atelier</a></p>
  <form method="dialog"><button class="bouton">Fermer</button></form>
</dialog>

<div class="jeu-toast" id="toast" role="status" hidden></div>
<script type="module" src="js/main.js?v=0.1.0"></script>
</body>
</html>
